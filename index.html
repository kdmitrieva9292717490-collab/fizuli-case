<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Страница закрыта от поисковиков: открывается только по прямой ссылке -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Fizuli — интернет-магазин одежды. Кейс</title>
  <style>
    :root { --black: #0e0d13; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--black); }

    /* Кейс — это фрейм «Кейс Fizuli» из Figma (1400 × 18 670), нарезанный на 12 блоков
       в двойной чёткости. Видео лежат поверх картинки своего блока, координаты — в процентах
       от размеров блока в Figma (1400 × --bh), поэтому совпадают с макетом при любой ширине
       и не копят округления соседних картинок */
    .case { max-width: 1400px; margin: 0 auto; }
    .case img { display: block; width: 100%; height: auto; }
    .block { position: relative; }

    .block video {
      position: absolute;
      left: calc(var(--x) / 1400 * 100%);
      top: calc(var(--y) / var(--bh) * 100%);
      width: calc(var(--w) / 1400 * 100%);
      height: calc(var(--h) / var(--bh) * 100%);
      object-fit: cover;
      display: block;
    }
    /* Экран планшета в «Странице товара» скруглён, как в Figma (радиус 16,5 при 545 × 787) */
    .case video.is-tablet { border-radius: 3.02% / 2.09%; }

    /* Все экраны: перетекающая подсветка из прошлой версии кейса. Анимируется только
       непрозрачность (сдвиги и масштаб дают дрожание текста на экранах); все картинки
       крутят одну анимацию, разводит их отрицательная задержка */
    .all-screens { position: relative; aspect-ratio: 1400 / 1339; background: var(--black); overflow: hidden; }
    .all-screens .shot {
      position: absolute; display: block; max-width: none;
      left: calc(var(--x) / 1400 * 100%); top: calc(var(--y) / 1339 * 100%);
      width: calc(386 / 1400 * 100%); height: calc(241 / 1339 * 100%);
      object-fit: cover; object-position: top center;
      opacity: 0; will-change: opacity; backface-visibility: hidden;
      animation: all-screens-fade 18s infinite both;
      animation-delay: calc(var(--i) * -1.5s);
    }
    .all-screens.is-paused .shot { animation-play-state: paused; }
    /* При появлении экран чуть вспыхивает: ярче и мягкое белое свечение, затем полная яркость */
    @keyframes all-screens-fade {
      0%      { opacity: 0; filter: brightness(1); box-shadow: 0 0 0 rgba(255, 255, 255, 0); animation-timing-function: linear; }
      12%     { opacity: .85; filter: brightness(1.18); box-shadow: 0 0 48px rgba(255, 255, 255, .22); animation-timing-function: ease-out; }
      16.67%  { opacity: 1; filter: brightness(1); box-shadow: 0 0 0 rgba(255, 255, 255, 0); animation-timing-function: linear; }
      25%     { opacity: 1; animation-timing-function: ease-out; }
      44.44%  { opacity: 0; }
      100%    { opacity: 0; }
    }
    /* Кому движение мешает — статичная сетка, по экрану на ячейку */
    @media (prefers-reduced-motion: reduce) {
      .all-screens .shot { animation: none; opacity: 0; }
      .all-screens .shot.is-static { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="case">
    <div class="block" style="--bh:1490">
      <img src="assets/case3/b01.webp" width="2800" height="2980" alt="Fizuli: главная страница сайта на ноутбуке. Бренд, проблема и задача">
      <!-- Обложка: главная сайта в экране ноутбука (ролик уже вписан в перспективу экрана) -->
      <video style="--x:423; --y:288; --w:678; --h:516" src="assets/case3/cover.mp4" poster="assets/case3/cover-poster.jpg" muted loop playsinline preload="metadata" aria-label="Главная страница Fizuli на ноутбуке"></video>
    </div>
    <img src="assets/case3/b02.webp" width="2800" height="4520" alt="Навигация: мегаменю на планшете, поиск и корзина на телефонах" loading="lazy">
    <img src="assets/case3/b03.webp" width="2800" height="3200" alt="Каталог с открытым фильтром на планшете и телефоне" loading="lazy">
    <div class="block" style="--bh:1050">
      <img src="assets/case3/b04.webp" width="2800" height="2100" alt="Фото бренда и видео пошива в каталоге" loading="lazy">
      <!-- Видео бренда «Процесс создания одежды» на месте карточки-заглушки (368 × 626) -->
      <video style="--x:866; --y:191; --w:368; --h:626" src="assets/case3/process.mp4" poster="assets/case3/process-poster.jpg" muted loop playsinline preload="metadata" aria-label="Процесс создания одежды Fizuli"></video>
    </div>
    <img src="assets/case3/b05.webp" width="2800" height="3226" alt="Категории" loading="lazy">
    <div class="block" style="--bh:953">
      <img src="assets/case3/b06.webp" width="2800" height="1906" alt="Карточка товара в каталоге на телефоне" loading="lazy">
      <!-- Карточка товара на ламелях: картинка блока собрана из сцены 2880 × 1961, ролик —
           только экран телефона в полном разрешении (вырез 730 × 1220 из той же сцены) -->
      <video style="--x:534.72; --y:175; --w:354.86; --h:593.06" src="assets/case3/card.mp4" poster="assets/case3/card-poster.jpg" muted loop playsinline preload="metadata" aria-label="Карточка товара в каталоге на телефоне"></video>
    </div>
    <img src="assets/case3/b07.webp" width="2800" height="4118" alt="Готовые образы: лукбук и выбор размеров" loading="lazy">
    <div class="block" style="--bh:1454">
      <img src="assets/case3/b08.webp" width="2800" height="2908" alt="Страница товара на планшете" loading="lazy">
      <!-- Страница товара: ролик в экране планшета -->
      <video class="is-tablet" style="--x:428.1; --y:333.4; --w:545; --h:787.1" src="assets/case3/product.mp4" poster="assets/case3/product-poster.jpg" muted loop playsinline preload="metadata" aria-label="Страница товара на планшете"></video>
    </div>
    <img src="assets/case3/b09.webp" width="2800" height="4240" alt="Оформление заказа: доставка по России, самовывоз, СНГ" loading="lazy">
    <img src="assets/case3/b10.webp" width="2800" height="2190" alt="Цвет и типографика" loading="lazy">
    <!-- Все экраны (анимация перенесена из прошлой версии кейса). Сетка 3×3 как в Figma:
         ячейки 386 × 241, колонки 73 / 507 / 941, ряды 320 / 610 / 900 от верха блока 1400 × 1339.
         Двенадцать экранов проступают из темноты по очереди, по одному каждые 1,5 с -->
    <section class="all-screens" aria-label="Все экраны">
      <img class="shot is-static" style="--x:507;--y:610;--i:0"  src="assets/screens/s01.jpg" alt="Главная" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:73;--y:320;--i:1"   src="assets/screens/s03.jpg" alt="Каталог — повседневная линия" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:941;--y:900;--i:2"  src="assets/screens/s05.jpg" alt="Карточка товара" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:941;--y:320;--i:3"  src="assets/screens/s02.jpg" alt="Мегаменю" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:73;--y:900;--i:4"   src="assets/screens/s06.jpg" alt="Корзина" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:507;--y:320;--i:5"  src="assets/screens/s11.jpg" alt="Готовые образы" loading="lazy" decoding="async">
      <img class="shot"           style="--x:507;--y:610;--i:6"  src="assets/screens/s07.jpg" alt="Оформление заказа" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:73;--y:610;--i:7"   src="assets/screens/s04.jpg" alt="Журнал — события" loading="lazy" decoding="async">
      <img class="shot"           style="--x:941;--y:900;--i:8"  src="assets/screens/s09.jpg" alt="Личный кабинет — заказы" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:507;--y:900;--i:9"  src="assets/screens/s08.jpg" alt="Покупателям — доставка" loading="lazy" decoding="async">
      <img class="shot"           style="--x:73;--y:900;--i:10"  src="assets/screens/s10.jpg" alt="О бренде" loading="lazy" decoding="async">
      <img class="shot is-static" style="--x:941;--y:610;--i:11" src="assets/screens/s12.jpg" alt="Журнал — люди" loading="lazy" decoding="async">
    </section>
    <img src="assets/case3/b12.webp" width="2800" height="3274" alt="Отзыв сооснователя бренда и участники проекта" loading="lazy">
  </main>

  <script>
    // Ролики играют, только пока видны на экране, — так страница не тянет три видео сразу
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause(); });
    }, { threshold: 0.25 });
    document.querySelectorAll('.case video').forEach((v) => io.observe(v));
    // Анимация «Все экраны» тоже стоит на паузе, пока блок не на экране
    const ioScreens = new IntersectionObserver((entries) => {
      entries.forEach((e) => e.target.classList.toggle('is-paused', !e.isIntersecting));
    });
    document.querySelectorAll('.all-screens').forEach((s) => ioScreens.observe(s));
  </script>
</body>
</html>
