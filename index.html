<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Страница закрыта от поисковиков: открывается только по прямой ссылке -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Fizuli — редизайн интернет-магазина. Кейс</title>
  <style>
    :root { --black: #0e0d13; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--black); }
    body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }

    .case { max-width: 1400px; margin: 0 auto; }

    /* Блок кейса: картинка из Figma 1:1, видео поверх — координаты в процентах
       от размеров блока в Figma (1400 × высота), чтобы совпадали при любой ширине */
    .block { position: relative; width: 100%; aspect-ratio: var(--w) / var(--h); overflow: hidden; }
    .block > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .block video {
      position: absolute;
      left: calc(var(--x) / var(--w) * 100%);
      top: calc(var(--y) / var(--h) * 100%);
      width: calc(var(--vw) / var(--w) * 100%);
      height: calc(var(--vh) / var(--h) * 100%);
      object-fit: cover;
      display: block;
    }

    /* Плавное появление блоков при прокрутке */
    .block { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s ease; }
    .block.is-visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .block { opacity: 1; transform: none; transition: none; } }
  </style>
</head>
<body>
  <main class="case">

    <section class="block" style="--w:1400; --h:1396">
      <img src="assets/images/block-01.jpg" alt="01 · Первый экран: редизайн интернет-магазина Fizuli на десктопе, планшете и телефоне">
    </section>

    <section class="block" style="--w:1400; --h:900">
      <img src="assets/images/block-02.jpg" alt="02 · Бренд и задача" loading="lazy">
    </section>

    <section class="block" style="--w:1400; --h:1280">
      <img src="assets/images/block-03.jpg" alt="Сценарии: покупка образа и быстрая покупка" loading="lazy">
      <!-- экраны телефонов под строкой статуса (34 px × 1.4) -->
      <video style="--x:180; --y:327; --vw:339; --vh:704; border-radius: 0 0 39px 39px" src="assets/videos/scenario-casual.mp4" muted loop playsinline preload="metadata"></video>
      <video style="--x:880; --y:327; --vw:339; --vh:704; border-radius: 0 0 39px 39px" src="assets/videos/scenario-sport.mp4" muted loop playsinline preload="metadata"></video>
    </section>

    <section class="block" style="--w:1400; --h:1003">
      <img src="assets/images/block-04.jpg" alt="Структура сайта" loading="lazy">
    </section>

    <section class="block" style="--w:1400; --h:1100">
      <img src="assets/images/block-05.jpg" alt="Цвет и типографика" loading="lazy">
    </section>

    <section class="block" style="--w:1400; --h:1373">
      <img src="assets/images/block-06.jpg" alt="Компоненты: фильтры, карточка товара, уведомление о поступлении" loading="lazy">
      <!-- фильтры: contain, чтобы кнопки внизу не обрезались -->
      <video style="--x:48; --y:163; --vw:454; --vh:900; object-fit: contain; background:#fff" src="assets/videos/filters.mp4" muted loop playsinline preload="metadata"></video>
      <!-- карточка: внутри полей 16 px -->
      <video style="--x:597; --y:179; --vw:286; --vh:479; background:#fff" src="assets/videos/card.mp4" muted loop playsinline preload="metadata"></video>
    </section>

    <section class="block" style="--w:1400; --h:1313">
      <img src="assets/images/block-07.jpg" alt="Путь к товару" loading="lazy">
      <!-- видео пути к товару ещё не записано: --x:48; --y:203; --vw:1304; --vh:815 -->
    </section>

  </main>

  <script>
    // Блоки проявляются при прокрутке; видео играют, только пока видны
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) e.target.classList.add('is-visible');
        e.target.querySelectorAll('video').forEach((v) => { e.isIntersecting ? v.play().catch(() => {}) : v.pause(); });
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.block').forEach((b) => io.observe(b));
  </script>
</body>
</html>
