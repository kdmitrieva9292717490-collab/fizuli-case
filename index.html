<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Страница закрыта от поисковиков: открывается только по прямой ссылке -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Fizuli — интернет-магазин одежды. Кейс</title>
  <style>
    :root { --black: #0e0d13; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--black); }

    /* Кейс — это фрейм «Кейс Fizuli» из Figma (1400 × 18 670), нарезанный на 12 блоков
       в двойной чёткости. Видео лежат поверх картинки своего блока, координаты — в процентах
       от размеров блока в Figma (1400 × --bh), поэтому совпадают с макетом при любой ширине
       и не копят округления соседних картинок */
    .case { max-width: 1400px; margin: 0 auto; }
    .case img { display: block; width: 100%; height: auto; }
    .block { position: relative; }

    .block video {
      position: absolute;
      left: calc(var(--x) / 1400 * 100%);
      top: calc(var(--y) / var(--bh) * 100%);
      width: calc(var(--w) / 1400 * 100%);
      height: calc(var(--h) / var(--bh) * 100%);
      object-fit: cover;
      display: block;
    }
    /* Экран планшета в «Странице товара» скруглён, как в Figma (радиус 16,5 при 545 × 787) */
    .case video.is-tablet { border-radius: 3.02% / 2.09%; }
  </style>
</head>
<body>
  <main class="case">
    <div class="block" style="--bh:1490">
      <img src="assets/case3/b01.webp" width="2800" height="2980" alt="Fizuli: главная страница сайта на ноутбуке. Бренд, проблема и задача">
      <!-- Обложка: главная сайта в экране ноутбука (ролик уже вписан в перспективу экрана) -->
      <video style="--x:423; --y:288; --w:678; --h:516" src="assets/case3/cover.mp4" poster="assets/case3/cover-poster.jpg" muted loop playsinline preload="metadata" aria-label="Главная страница Fizuli на ноутбуке"></video>
    </div>
    <img src="assets/case3/b02.webp" width="2800" height="4520" alt="Навигация: мегаменю на планшете, поиск и корзина на телефонах" loading="lazy">
    <img src="assets/case3/b03.webp" width="2800" height="3200" alt="Каталог с открытым фильтром на планшете и телефоне" loading="lazy">
    <img src="assets/case3/b04.webp" width="2800" height="2100" alt="Фото бренда и видео пошива в каталоге" loading="lazy">
    <img src="assets/case3/b05.webp" width="2800" height="3226" alt="Категории" loading="lazy">
    <div class="block" style="--bh:953">
      <img src="assets/case3/b06.webp" width="2800" height="1906" alt="Карточка товара в каталоге на телефоне" loading="lazy">
      <!-- Карточка товара на ламелях: ролик — вся сцена блока -->
      <video style="--x:0; --y:0; --w:1400; --h:953" src="assets/case3/card.mp4" poster="assets/case3/card-poster.jpg" muted loop playsinline preload="metadata" aria-label="Карточка товара в каталоге на телефоне"></video>
    </div>
    <img src="assets/case3/b07.webp" width="2800" height="4118" alt="Готовые образы: лукбук и выбор размеров" loading="lazy">
    <div class="block" style="--bh:1454">
      <img src="assets/case3/b08.webp" width="2800" height="2908" alt="Страница товара на планшете" loading="lazy">
      <!-- Страница товара: ролик в экране планшета -->
      <video class="is-tablet" style="--x:428.1; --y:333.4; --w:545; --h:787.1" src="assets/case3/product.mp4" poster="assets/case3/product-poster.jpg" muted loop playsinline preload="metadata" aria-label="Страница товара на планшете"></video>
    </div>
    <img src="assets/case3/b09.webp" width="2800" height="4240" alt="Оформление заказа: доставка по России, самовывоз, СНГ" loading="lazy">
    <img src="assets/case3/b10.webp" width="2800" height="2190" alt="Цвет и типографика" loading="lazy">
    <img src="assets/case3/b11.webp" width="2800" height="2678" alt="Все экраны" loading="lazy">
    <img src="assets/case3/b12.webp" width="2800" height="3274" alt="Отзыв сооснователя бренда и участники проекта" loading="lazy">
  </main>

  <script>
    // Ролики играют, только пока видны на экране, — так страница не тянет три видео сразу
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause(); });
    }, { threshold: 0.25 });
    document.querySelectorAll('.case video').forEach((v) => io.observe(v));
  </script>
</body>
</html>
